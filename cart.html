<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4b2e2e">
    <title>Brew Bliss Café - Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Brew Bliss ☕</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="cart.html" class="active">Cart</a></li>
                <li><a href="order.html">Order</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="page-content">

        <section class="cart-page">
            <h2>Your Cart</h2>

            <div id="cartItems"></div>

            <p class="total">
                Total: <span id="cartTotal">₹0</span>
            </p>

            <p id="checkoutMessage"
               role="status"
               aria-live="polite"
               style="margin-bottom: 15px; color: #a33;">
            </p>

            <button
                type="button"
                class="btn"
                id="checkoutBtn"
                onclick="proceedToCheckout()">
                Proceed to Checkout
            </button>

            <p style="margin-top: 20px;">
                <a href="index.html">← Continue Shopping</a>
            </p>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 Brew Bliss Café | Crafted with ❤️</p>
        <p>Freshly brewed happiness, in every cup. ☕</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
